name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - run: npm ci
      - run: npm test

  preflight:
    name: Release preflight
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use npm 11
        run: npm install --global npm@11
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run test:package

  publish:
    name: Publish to npm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use npm 11
        run: npm install --global npm@11
      - run: npm ci
      - name: Fetch master
        run: git fetch --no-tags origin refs/heads/master:refs/remotes/origin/master
      - name: Validate release
        run: node scripts/validate-release.mjs
      - name: Check published version
        id: published
        shell: bash
        run: |
          package_spec="$(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          if npm view "$package_spec" version >/dev/null 2>&1; then
            if [[ "$GITHUB_RUN_ATTEMPT" == "1" ]]; then
              echo "::error::$package_spec already exists in the npm registry"
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$package_spec was already published by an earlier workflow attempt"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish package
        if: steps.published.outputs.exists != 'true'
        run: npm publish
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
